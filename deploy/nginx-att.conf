# nginx site for ATT Academy. Install:
#   cp nginx-att.conf /etc/nginx/sites-available/att   (replace att.example.ru with your domain everywhere)
#   ln -s /etc/nginx/sites-available/att /etc/nginx/sites-enabled/att && rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
# then: certbot --nginx -d att.example.ru   (it adds the HTTPS part and the redirect)
#
# The site (static files) and the API share one domain: /api/ is forwarded to Node on 127.0.0.1:3050, so the
# browser sees a single origin: no CORS, no address to configure in the app.

# Brake on password guessing, per client address (the app also locks an account after 5 failures).
limit_req_zone $binary_remote_addr zone=att_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=att_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name att.example.ru;

    root /var/www/att;
    index index.html;

    client_max_body_size 1m;           # the API takes small JSON only (file upload comes with the storage step)
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # certbot turns on HTTPS; once it works add:  add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API → Node. The prefix /api/ is cut off (/api/auth/login → /auth/login).
    location /api/auth/ {
        limit_req zone=att_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3050/auth/;
        include /etc/nginx/att-proxy.conf;
    }
    location /api/ {
        limit_req zone=att_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3050/;
        include /etc/nginx/att-proxy.conf;
    }

    # The page itself must always be fresh; icons and the React files may be cached.
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location = /schedule.json { add_header Cache-Control "no-cache" always; }
    location /vendor/ { expires 30d; add_header Cache-Control "public" always; }

    location / { try_files $uri $uri/ /index.html; }

    # Never serve hidden files.
    location ~ /\. { deny all; }
}
