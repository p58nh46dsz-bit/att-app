name: Build app

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/build.js"
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build index.html from src/
        run: npm run build

      - name: Commit if changed
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git pull --rebase
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "chore: rebuild index.html from src/"
            git push
          else
            echo "No changes to index.html"
          fi
