name: Update schedule

on:
  schedule:
    # Evening run, 18:00 MSK, every day (target = tomorrow, auto: hour >= 9 UTC). Every day, not only on working days,
    # because the academy sometimes has classes on a Saturday/Sunday.
    - cron: "0 15 * * *"   # 18:00 MSK
    # Morning run, 05:00 MSK (target = today, auto: hour < 9 UTC), so today's timetable is current when the day starts.
    - cron: "0 2 * * *"    # 05:00 MSK
  workflow_dispatch:
    inputs:
      target:
        description: "today | tomorrow | auto"
        default: "auto"
        required: false

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pdfplumber

      - name: Determine target
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.target }}" ]; then
            echo "target=${{ github.event.inputs.target }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Scrape schedule
        run: python3 scripts/scrape_schedule.py --target ${{ steps.vars.outputs.target }} --out schedule.json

      # The teachers' timetable (every teacher, every group). A failure here must not lose the group timetable above.
      - name: Scrape teachers' timetable
        if: always()
        continue-on-error: true
        run: python3 scripts/scrape_teachers.py --target ${{ steps.vars.outputs.target }} --back 6 --out teacher_schedule.json

      - name: Commit if changed
        if: always()
        run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add -N teacher_schedule.json 2>/dev/null || true
          if ! git diff --quiet -- schedule.json teacher_schedule.json; then
            git add schedule.json teacher_schedule.json 2>/dev/null || git add schedule.json
            git commit -m "chore: update schedule.json and teacher_schedule.json"
            git push
          else
            echo "No changes to the timetables"
          fi
