<script>
const w=document.getElementById('w');
w.querySelectorAll('.tbl').forEach(g=>{g.addEventListener('mouseenter',()=>{const t=g.dataset.t;w.classList.add('dim');const rel=new Set([t]);
w.querySelectorAll('.rel').forEach(r=>{if(r.dataset.a===t||r.dataset.b===t){r.classList.add('hot');rel.add(r.dataset.a);rel.add(r.dataset.b)}});
w.querySelectorAll('.tbl').forEach(x=>{if(rel.has(x.dataset.t))x.classList.add('hot')});});
g.addEventListener('mouseleave',()=>{w.classList.remove('dim');w.querySelectorAll('.hot').forEach(x=>x.classList.remove('hot'))});});
</script></body></html>
